  <div id="__bundler_placeholder">Loading LOOPX...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>LOOPX<\u002Ftitle>\n<script>/* LOOPX server bridge.\n * Loaded before the console. When the page is served by the LOOPX server it:\n *  - exposes window.LX.api() for the console's server calls\n *  - replaces the design preview's window.claude with one that asks the server's Claude connection\n *  - adds the \"Connections\" panel (sender, reply inbox, store connectors, Events API, imports, test replies)\n * Opened as a plain file (no server), it does nothing and the console runs its sample data.\n */\n(function () {\n  var LX = (window.LX = { server: false, health: null, currentWs: null, comp: null });\n  try {\n    var x = new XMLHttpRequest();\n    x.open('GET', '/api/health', false);\n    x.send();\n    if (x.status === 200) { LX.health = JSON.parse(x.responseText); LX.server = true; }\n  } catch (e) { /* opened as a file */ }\n  if (!LX.server) return;\n\n  LX.api = function (method, path, body, raw) {\n    var opt = { method: method, credentials: 'same-origin', headers: {} };\n    if (body !== undefined) {\n      if (raw) { opt.body = body; } else { opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(body); }\n    }\n    return fetch('/api' + path, opt).then(function (r) {\n      return r.text().then(function (t) {\n        var j = null;\n        try { j = t ? JSON.parse(t) : null; } catch (e) {}\n        if (!r.ok) {\n          var d = j && j.detail;\n          var err = new Error(typeof d === 'string' ? d : (d && d.message) || 'Request failed (' + r.status + ')');\n          err.status = r.status; err.code = d && d.code;\n          throw err;\n        }\n        return j;\n      });\n    });\n  };\n\n  // The console asks window.claude.use('sample') for Claude. Route it to the server.\n  window.claude = {\n    use: function (name) {\n      if (name !== 'sample' || !LX.health.ai) return Promise.resolve(null);\n      var wrap = function (e) { throw { code: e.code || (e.status === 429 ? 'rate_limited' : 'unavailable'), message: e.message }; };\n      var f = function (input, opts) { return LX.api('POST', '/ai/sample', { input: input, opts: opts || {} }).catch(wrap); };\n      f.json = function (input, opts) {\n        return LX.api('POST', '/ai/sample', { input: input, opts: opts || {}, json: true }).then(function (r) {\n          if (r.json == null) throw { code: 'bad_json', message: 'Claude did not return JSON.' };\n          return r.json;\n        }, wrap);\n      };\n      return Promise.resolve(f);\n    }\n  };\n\n  // ------------------------------------------------------------------ Connections panel\n  var css = '' +\n    '#lxp-btn{position:fixed;right:18px;bottom:18px;z-index:9998;background:#5B3DF5;color:#fff;border:0;border-radius:999px;padding:10px 16px;font:600 13px Figtree,Arial,sans-serif;box-shadow:0 6px 20px rgba(60,30,160,.35);cursor:pointer}' +\n    '#lxp-wrap{position:fixed;inset:0;z-index:9999;background:rgba(20,14,40,.45);display:none;align-items:center;justify-content:center}' +\n    '#lxp{width:min(880px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(20,14,40,.35);font:14px/1.5 Figtree,Arial,sans-serif;color:#1E1638}' +\n    '#lxp header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #ECEAF4;position:sticky;top:0;background:#fff;z-index:1}' +\n    '#lxp h2{font-size:18px;margin:0}#lxp h3{font-size:15px;margin:18px 0 8px}#lxp .tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 22px 0}' +\n    '#lxp .tab{border:1px solid #E4E1F0;background:#F7F6FB;border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}#lxp .tab.on{background:#5B3DF5;color:#fff;border-color:#5B3DF5}' +\n    '#lxp .body{padding:6px 22px 22px}#lxp label{display:block;font-size:12px;color:#5D5478;margin:10px 0 4px}' +\n    '#lxp input,#lxp select,#lxp textarea{width:100%;box-sizing:border-box;border:1px solid #DCD8EA;border-radius:8px;padding:8px 10px;font:inherit}' +\n    '#lxp .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}#lxp .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}' +\n    '#lxp .btn{background:#5B3DF5;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:600 13px inherit;cursor:pointer;margin:12px 8px 0 0}' +\n    '#lxp .btn.sec{background:#F1EEFD;color:#3B2A9A}#lxp .msg{margin-top:10px;font-size:13px;color:#0A7A55}#lxp .err{color:#B42318}' +\n    '#lxp code,#lxp pre{background:#F7F6FB;border-radius:6px;padding:2px 6px;font:12px ui-monospace,Menlo,monospace}#lxp pre{padding:10px;white-space:pre-wrap;word-break:break-all}' +\n    '#lxp table{width:100%;border-collapse:collapse;font-size:12.5px}#lxp td,#lxp th{border-bottom:1px solid #F0EEF6;padding:6px 4px;text-align:left;vertical-align:top}' +\n    '#lxp .pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;background:#F1EEFD;color:#3B2A9A}#lxp .ok{background:#E6F6EF;color:#0A7A55}#lxp .warn{background:#FFF3E0;color:#9A5B00}' +\n    '#lxp .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}#lxp .card{border:1px solid #ECEAF4;border-radius:10px;padding:10px 12px}#lxp .card b{display:block;font-size:16px}';\n\n  var tab = 'status';\n  function el(h) { var d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; }\n  function esc(s) { return String(s == null ? '' : s).replace(/[&<>\"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]; }); }\n  function val(id) { var e = document.getElementById(id); return e ? e.value : ''; }\n  function say(id, text, bad) { var e = document.getElementById(id); if (e) { e.textContent = text; e.className = 'msg' + (bad ? ' err' : ''); } }\n  function wsPath(p) { return '/workspaces/' + LX.currentWs + (p || ''); }\n  function refreshConsole() { if (LX.comp && LX.comp.srvRefreshAll) LX.comp.srvRefreshAll(); }\n\n  function open() {\n    if (!LX.currentWs) {\n      var name = LX.sampleName || 'this sample client';\n      if (LX.comp && LX.comp.srvAdopt && confirm(name + ' is a sample with demo data. Create a real ' + name + ' on the server, with the same playbook and no customers yet?')) LX.comp.srvAdopt();\n      return;\n    }\n    document.getElementById('lxp-wrap').style.display = 'flex';\n    render();\n  }\n  function close() { document.getElementById('lxp-wrap').style.display = 'none'; }\n\n  function render() {\n    var box = document.getElementById('lxp');\n    var tabs = [['status', 'Status'], ['plan', \"Today's plan\"], ['sender', 'Sender'], ['inbox', 'Reply inbox'], ['stores', 'Store connectors'], ['api', 'Events API'], ['import', 'Import file'], ['reply', 'Test a reply'], ['team', 'Team']];\n    box.innerHTML = '<header><h2>Connections<\\/h2><button class=\"btn sec\" id=\"lxp-x\" style=\"margin:0\">Close<\\/button><\\/header>' +\n      '<div class=\"tabs\">' + tabs.map(function (t) { return '<button class=\"tab' + (t[0] === tab ? ' on' : '') + '\" data-t=\"' + t[0] + '\">' + t[1] + '<\\/button>'; }).join('') + '<\\/div>' +\n      '<div class=\"body\" id=\"lxp-body\">Loading…<\\/div>';\n    box.querySelector('#lxp-x').onclick = close;\n    Array.prototype.forEach.call(box.querySelectorAll('.tab'), function (b) { b.onclick = function () { tab = b.getAttribute('data-t'); render(); }; });\n    ({ status: pStatus, plan: pPlan, sender: pSender, inbox: pInbox, stores: pStores, api: pApi, import: pImport, reply: pReply, team: pTeam })[tab]();\n  }\n  function body(h) { document.getElementById('lxp-body').innerHTML = h; }\n\n  function pStatus() {\n    Promise.all([LX.api('GET', wsPath('/live')), LX.api('GET', '/health')]).then(function (r) {\n      var L = r[0], H = r[1], rs = L.rs, p = L.plan;\n      body('<div class=\"grid\">' +\n        [['Emails sent today', rs.sent], ['Opened', rs.opened], ['Replies', rs.replied], ['Returned', rs.returned]].map(function (x) { return '<div class=\"card\">' + x[0] + '<b>' + x[1] + '<\\/b><\\/div>'; }).join('') + '<\\/div>' +\n        '<h3>Server<\\/h3><table>' +\n        '<tr><td>Sending<\\/td><td><span class=\"pill ' + (H.mail === 'console' ? 'warn' : 'ok') + '\">' + esc(H.mail) + '<\\/span> ' + (H.mail === 'console' ? 'Emails are written to data/outbox/outbox.jsonl, not sent. Set MAIL_PROVIDER=brevo or smtp.' : '') + '<\\/td><\\/tr>' +\n        '<tr><td>Claude (AI)<\\/td><td><span class=\"pill ' + (H.ai ? 'ok' : 'warn') + '\">' + (H.ai ? 'on' : 'off') + '<\\/span> ' + (H.ai ? '' : 'Set ANTHROPIC_API_KEY. Without it the agents use rules and no AI text.') + '<\\/td><\\/tr>' +\n        '<tr><td>Database<\\/td><td>' + esc(H.db) + '<\\/td><\\/tr>' +\n        '<tr><td>Reply inbox<\\/td><td>' + (L.imap ? '<span class=\"pill ok\">connected<\\/span>' : '<span class=\"pill warn\">not set up<\\/span>') + (L.imapError ? ' <span class=\"err\">' + esc(L.imapError) + '<\\/span>' : '') + '<\\/td><\\/tr>' +\n        '<tr><td>Daily sending limit left<\\/td><td>' + L.quotaLeft + ' of ' + H.daily_limit + '<\\/td><\\/tr>' +\n        '<tr><td>Agents last ran<\\/td><td>' + (L.lastTick ? new Date(L.lastTick + 'Z').toLocaleString() : 'not yet') + (L.paused ? ' <span class=\"pill warn\">all paused<\\/span>' : '') + '<\\/td><\\/tr>' +\n        '<tr><td>Today\\'s plan<\\/td><td>' + (p ? esc(p.status) + ' · ' + (p.summary.emails || 0) + ' emails, ' + (p.summary.holdout || 0) + ' holdout, ' + (p.summary.held || 0) + ' held' : 'not built yet') + '<\\/td><\\/tr>' +\n        '<\\/table><button class=\"btn\" id=\"lxp-run\">Run the agents now<\\/button><button class=\"btn sec\" id=\"lxp-build\">Rebuild today\\'s plan<\\/button><div id=\"lxp-m\"><\\/div>');\n      document.getElementById('lxp-run').onclick = function () {\n        say('lxp-m', 'Running…');\n        LX.api('POST', wsPath('/tick')).then(function (r) { say('lxp-m', 'Done: ' + (r.sent || 0) + ' emails sent, ' + (r.replies || 0) + ' replies read.'); refreshConsole(); setTimeout(pStatus, 600); }, function (e) { say('lxp-m', e.message, 1); });\n      };\n      document.getElementById('lxp-build').onclick = function () {\n        LX.api('POST', wsPath('/plan/build')).then(function (r) { say('lxp-m', 'Plan rebuilt: ' + esc(r.plan.status) + ', ' + (r.plan.summary.emails || 0) + ' emails.'); refreshConsole(); }, function (e) { say('lxp-m', e.message, 1); });\n      };\n    }, function (e) { body('<p class=\"err\">' + esc(e.message) + '<\\/p>'); });\n  }\n\n  function pPlan() {\n    LX.api('GET', wsPath('/plan')).then(function (r) {\n      if (!r.plan) { body('<p>No plan yet today. The Timing agent builds it after ' + 'PLAN_HOUR, or click “Rebuild today\\'s plan” on the Status tab.<\\/p>'); return; }\n      body('<p>Status: <b>' + esc(r.plan.status) + '<\\/b>' + (r.plan.approvedBy ? ' · approved by ' + esc(r.plan.approvedBy) : '') + '. First 60 emails:<\\/p><table><tr><th>To<\\/th><th>Campaign<\\/th><th>Subject<\\/th><th>Status<\\/th><\\/tr>' +\n        r.sends.map(function (s) { return '<tr><td>' + esc(s.who) + '<br><small>' + esc(s.to) + '<\\/small><\\/td><td>' + esc(s.campaign) + (s.wave ? ' <span class=\"pill\">test wave<\\/span>' : '') + '<\\/td><td>' + esc(s.subject) + ' <small>(' + s.variant + ')<\\/small><\\/td><td><span class=\"pill\">' + esc(s.status) + '<\\/span>' + (s.hold ? '<br><small>' + esc(s.hold) + '<\\/small>' : '') + '<\\/td><\\/tr>'; }).join('') + '<\\/table>' +\n        (r.sends[0] ? '<h3>Example email<\\/h3><pre>' + esc(r.sends[0].subject + '\\n\\n' + r.sends[0].body) + '<\\/pre>' : ''));\n    });\n  }\n\n  function pSender() {\n    LX.api('GET', wsPath()).then(function (r) {\n      var s = r.workspace.settings || {};\n      body('<p>How this client\\'s reminders look in the inbox, and the dates the Timing agent respects.<\\/p><div class=\"row\"><div><label>From name<\\/label><input id=\"s-fn\" value=\"' + esc(s.from_name || r.workspace.name) + '\"><\\/div><div><label>From email (verified with your provider)<\\/label><input id=\"s-fe\" value=\"' + esc(s.from_email || '') + '\" placeholder=\"reminders@yourdomain.com\"><\\/div><\\/div>' +\n        '<div class=\"row\"><div><label>Reply-to (the inbox the Listener reads)<\\/label><input id=\"s-rt\" value=\"' + esc(s.reply_to || '') + '\"><\\/div><div><label>Website (the button in each email)<\\/label><input id=\"s-web\" value=\"' + esc(s.website || '') + '\"><\\/div><\\/div>' +\n        '<div class=\"row3\"><div><label>Time zone<\\/label><input id=\"s-tz\" value=\"' + esc(s.timezone || 'Asia/Kolkata') + '\"><\\/div><div><label>Country for bank holidays (e.g. IN, US, GB)<\\/label><input id=\"s-co\" value=\"' + esc(s.country || '') + '\"><\\/div><div><label>Team email for complaints<\\/label><input id=\"s-ow\" value=\"' + esc(s.owner_email || '') + '\"><\\/div><\\/div>' +\n        '<button class=\"btn\" id=\"s-save\">Save<\\/button><div id=\"s-m\"><\\/div>');\n      document.getElementById('s-save').onclick = function () {\n        LX.api('PATCH', wsPath(), { settings: { from_name: val('s-fn'), from_email: val('s-fe'), reply_to: val('s-rt'), website: val('s-web'), timezone: val('s-tz'), country: val('s-co').toUpperCase(), owner_email: val('s-ow') } })\n          .then(function () { say('s-m', 'Saved.'); }, function (e) { say('s-m', e.message, 1); });\n      };\n    });\n  }\n\n  function pInbox() {\n    LX.api('GET', wsPath()).then(function (r) {\n      var i = (r.workspace.settings || {}).imap || {};\n      body('<p>The Listener agent reads replies from this mailbox over IMAP. For Gmail: turn on 2-step verification, create an <b>app password<\\/b>, host <code>imap.gmail.com<\\/code>. Leave empty to use the server-wide IMAP_* settings.<\\/p>' +\n        '<div class=\"row\"><div><label>IMAP host<\\/label><input id=\"i-h\" value=\"' + esc(i.host || '') + '\" placeholder=\"imap.gmail.com\"><\\/div><div><label>Folder<\\/label><input id=\"i-f\" value=\"' + esc(i.folder || 'INBOX') + '\"><\\/div><\\/div>' +\n        '<div class=\"row\"><div><label>User<\\/label><input id=\"i-u\" value=\"' + esc(i.user || '') + '\"><\\/div><div><label>App password<\\/label><input id=\"i-p\" type=\"password\" value=\"' + esc(i.password || '') + '\"><\\/div><\\/div>' +\n        '<button class=\"btn\" id=\"i-save\">Save<\\/button><div id=\"i-m\"><\\/div>');\n      document.getElementById('i-save').onclick = function () {\n        LX.api('PATCH', wsPath(), { settings: { imap: { host: val('i-h'), folder: val('i-f'), user: val('i-u'), password: val('i-p') } } })\n          .then(function () { say('i-m', 'Saved. The Listener reads new mail on the next agent run.'); }, function (e) { say('i-m', e.message, 1); });\n      };\n    });\n  }\n\n  function pStores() {\n    LX.api('GET', wsPath()).then(function (r) {\n      var c = (r.workspace.settings || {}).connectors || {};\n      var sh = c.shopify || {}, st = c.stripe || {}, wo = c.woocommerce || {};\n      function last(x) { return x.last_sync ? '<small>Last sync ' + new Date(x.last_sync + 'Z').toLocaleString() + '<\\/small>' : ''; }\n      body('<p>Orders from these stores become purchase events. Timing uses them to predict return dates, and Analyst uses them to count returns. They sync every hour.<\\/p>' +\n        '<h3>Shopify<\\/h3><div class=\"row\"><div><label>Shop domain<\\/label><input id=\"c-sh\" value=\"' + esc(sh.shop || '') + '\" placeholder=\"yourstore.myshopify.com\"><\\/div><div><label>Admin API access token (read_orders, read_customers)<\\/label><input id=\"c-st\" value=\"' + esc(sh.token || '') + '\"><\\/div><\\/div>' + last(sh) +\n        '<button class=\"btn\" data-c=\"shopify\">Save<\\/button><button class=\"btn sec\" data-s=\"shopify\">Sync now<\\/button>' +\n        '<h3>Stripe<\\/h3><label>Restricted key (read-only: Charges, Customers)<\\/label><input id=\"c-sk\" value=\"' + esc(st.key || '') + '\">' + last(st) +\n        '<button class=\"btn\" data-c=\"stripe\">Save<\\/button><button class=\"btn sec\" data-s=\"stripe\">Sync now<\\/button>' +\n        '<h3>WooCommerce<\\/h3><div class=\"row3\"><div><label>Store URL<\\/label><input id=\"c-wu\" value=\"' + esc(wo.url || '') + '\"><\\/div><div><label>Consumer key<\\/label><input id=\"c-wk\" value=\"' + esc(wo.key || '') + '\"><\\/div><div><label>Consumer secret<\\/label><input id=\"c-ws\" value=\"' + esc(wo.secret || '') + '\"><\\/div><\\/div>' + last(wo) +\n        '<button class=\"btn\" data-c=\"woocommerce\">Save<\\/button><button class=\"btn sec\" data-s=\"woocommerce\">Sync now<\\/button><div id=\"c-m\"><\\/div>');\n      var vals = { shopify: function () { return { shop: val('c-sh'), token: val('c-st') }; }, stripe: function () { return { key: val('c-sk') }; }, woocommerce: function () { return { url: val('c-wu'), key: val('c-wk'), secret: val('c-ws') }; } };\n      Array.prototype.forEach.call(document.querySelectorAll('#lxp [data-c]'), function (b) {\n        b.onclick = function () { var n = b.getAttribute('data-c'); LX.api('PUT', wsPath('/connectors/' + n), vals[n]()).then(function () { say('c-m', n + ' saved.'); }, function (e) { say('c-m', e.message, 1); }); };\n      });\n      Array.prototype.forEach.call(document.querySelectorAll('#lxp [data-s]'), function (b) {\n        b.onclick = function () {\n          var n = b.getAttribute('data-s'); say('c-m', 'Syncing ' + n + '…');\n          LX.api('POST', wsPath('/connectors/' + n + '/sync')).then(function (r) { if (r.ok) { say('c-m', n + ': ' + r.fetched + ' orders read, ' + r.added + ' new.'); refreshConsole(); } else say('c-m', r.error, 1); }, function (e) { say('c-m', e.message, 1); });\n        };\n      });\n    });\n  }\n\n  function pApi() {\n    LX.api('GET', wsPath()).then(function (r) {\n      var key = r.workspace.api_key, base = location.origin;\n      body('<p>Your own system can send customers and purchases straight to this client. Each purchase updates the customer\\'s pattern and counts as a return if it follows a reminder.<\\/p>' +\n        '<label>API key for ' + esc(r.workspace.name) + '<\\/label><input readonly value=\"' + esc(key) + '\">' +\n        '<h3>Send a purchase<\\/h3><pre>curl -X POST ' + base + '/api/v1/events \\\\\\n  -H \"X-API-Key: ' + esc(key) + '\" -H \"Content-Type: application/json\" \\\\\\n  -d \\'{\"events\":[{\"email\":\"asha@example.com\",\"at\":\"2026-11-11T10:30:00Z\",\"kind\":\"purchase\",\"amount\":499,\"external_id\":\"order-1001\",\"first\":\"Asha\"}]}\\'<\\/pre>' +\n        '<h3>Add or update customers<\\/h3><pre>curl -X POST ' + base + '/api/v1/contacts \\\\\\n  -H \"X-API-Key: ' + esc(key) + '\" -H \"Content-Type: application/json\" \\\\\\n  -d \\'{\"contacts\":[{\"email\":\"asha@example.com\",\"first\":\"Asha\",\"company\":\"Asha Stores\",\"subscribed\":true}]}\\'<\\/pre>' +\n        '<p><small>external_id makes calls safe to repeat: the same order is never counted twice.<\\/small><\\/p>');\n    });\n  }\n\n  function pImport() {\n    body('<p>Upload a CSV of <b>customers<\\/b> (one row each: email, first name, first and last order date, number of orders) or of <b>orders<\\/b> (one row per order: email, order date, amount, order id). LOOPX detects which one it is from the column names.<\\/p>' +\n      '<input type=\"file\" id=\"f-file\" accept=\".csv,text/csv\"><button class=\"btn\" id=\"f-go\">Import<\\/button><div id=\"f-m\"><\\/div>' +\n      '<p><small>The Customers screen\\'s own importer also saves to the server.<\\/small><\\/p>');\n    document.getElementById('f-go').onclick = function () {\n      var f = document.getElementById('f-file').files[0];\n      if (!f) { say('f-m', 'Choose a file first.', 1); return; }\n      var fd = new FormData(); fd.append('file', f);\n      say('f-m', 'Importing…');\n      LX.api('POST', wsPath('/import'), fd, true).then(function (r) {\n        say('f-m', 'Imported ' + r.kind + ': ' + (r.added || 0) + ' added' + (r.updated != null ? ', ' + r.updated + ' updated' : '') + (r.duplicates ? ', ' + r.duplicates + ' already known' : '') + ', ' + (r.skipped || 0) + ' skipped.');\n        refreshConsole();\n      }, function (e) { say('f-m', e.message, 1); });\n    };\n  }\n\n  function pReply() {\n    body('<p>Try the Listener without waiting for real mail: paste a reply as if a customer sent it.<\\/p>' +\n      '<div class=\"row\"><div><label>From (a customer\\'s email)<\\/label><input id=\"r-f\"><\\/div><div><label>Subject<\\/label><input id=\"r-s\" value=\"Re: your reminder\"><\\/div><\\/div>' +\n      '<label>Reply<\\/label><textarea id=\"r-b\" rows=\"4\" placeholder=\"Please take me off this list.\"><\\/textarea><button class=\"btn\" id=\"r-go\">Give it to the Listener<\\/button><div id=\"r-m\"><\\/div><h3>Recent replies<\\/h3><div id=\"r-list\">Loading…<\\/div>');\n    function list() {\n      LX.api('GET', wsPath('/replies')).then(function (r) {\n        document.getElementById('r-list').innerHTML = r.replies.length ? '<table>' + r.replies.map(function (x) { return '<tr><td>' + esc(x.from) + '<\\/td><td><span class=\"pill\">' + esc(x.category) + ' ' + x.conf + '%<\\/span><\\/td><td>' + esc(x.summary || x.body.slice(0, 120)) + '<\\/td><\\/tr>'; }).join('') + '<\\/table>' : '<p>No replies yet.<\\/p>';\n      });\n    }\n    list();\n    document.getElementById('r-go').onclick = function () {\n      LX.api('POST', wsPath('/replies'), { from: val('r-f'), subject: val('r-s'), body: val('r-b') }).then(function (r) {\n        say('r-m', r.reply ? 'Listener read it as “' + r.reply.category + '” (' + r.reply.conf + '% certain). See the Listener agent\\'s decisions.' : 'Already read.');\n        list(); refreshConsole();\n      }, function (e) { say('r-m', e.message, 1); });\n    };\n  }\n\n  function pTeam() {\n    LX.api('GET', '/team').then(function (r) {\n      body('<p>Everyone who can sign in. New sign-ups start as Viewer; an admin raises the role here.<\\/p><table><tr><th>Name<\\/th><th>Email<\\/th><th>Role<\\/th><\\/tr>' +\n        r.team.map(function (u) { return '<tr><td>' + esc(u.name) + '<\\/td><td>' + esc(u.email) + '<\\/td><td><select data-u=\"' + u.id + '\">' + ['Ad der-bottom: 1px solid var(--line2)\">\n<div style=\"flex: 3 1 230px; min-width: 0\"><div style=\"font-weight: 700\">{{ cr.name }}<\u002Fdiv><div style=\"font-size: 14px; color: var(--mut)\">{{ cr.kind }}<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 100px\"><div style=\"font-family: 'Sora', sans-serif; font-weight: 700; font-size: 19px; {{ cr.numCss }}\">{{ cr.n }}<\u002Fdiv><div style=\"font-size: 13px; color: var(--mut)\">customers<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 2 1 170px\"><div style=\"font-weight: 600\">{{ cr.time }}<\u002Fdiv><div style=\"font-size: 13px; color: var(--mut)\">Send time<\u002Fdiv><\u002Fdiv>\n<span style=\"flex: 0 0 auto; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; {{ cr.chipCss }}\">{{ cr.status }}<\u002Fspan>\n<div style=\"flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto\">\n<button type=\"button\" sc-camel-on-click=\"{{ cr.run }}\" disabled=\"{{ cr.noRun }}\" aria-label=\"{{ cr.runAria }}\" style=\"min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass2); font-weight: 600; font-size: 14px; color: var(--okInk)\">Run<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ cr.hold }}\" disabled=\"{{ cr.noHold }}\" aria-label=\"{{ cr.holdAria }}\" style=\"min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass2); font-weight: 600; font-size: 14px\">Hold<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ cr.pause }}\" disabled=\"{{ cr.noPause }}\" aria-label=\"{{ cr.pauseAria }}\" style=\"min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass2); font-weight: 600; font-size: 14px\">Pause<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ cr.details }}\" aria-label=\"{{ cr.detailsAria }}\" style=\"min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--grad); color: #FFFFFF; font-weight: 700\">Details<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{ cl.noRows }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; padding: 20px 0; color: var(--mut)\">No campaign has this status right now.<\u002Fp>\n<\u002Fsc-if>\n<p style=\"margin: 0; padding: 12px 0; font-size: 14px; color: var(--mut)\">Hold keeps a campaign out of the next send. Pause stops one that has already started. Run puts it back.<\u002Fp>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ cl.isGroups }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start\">\n<section aria-label=\"Saved groups\" style=\"flex: 3 1 420px; min-width: 0; box-sizing: border-box; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--glassLine); border-radius: 20px; box-shadow: 0 10px 30px rgba(76,40,180,0.10); padding: 4px 20px 12px\">\n<sc-for list=\"{{ cl.groups }}\" as=\"gr\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px 0; border-bottom: 1px solid var(--line2)\">\n<div style=\"flex: 3 1 220px; min-width: 0\"><div style=\"font-weight: 700\">{{ gr.name }}<\u002Fdiv><div style=\"font-size: 14px; color: var(--mut)\">{{ gr.rule }}<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 100px\"><div style=\"font-family: 'Sora', sans-serif; font-weight: 700; font-size: 19px; {{ gr.numCss }}\">{{ gr.n }}<\u002Fdiv><div style=\"font-size: 13px; color: var(--mut)\">customers today<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto\">\n<button type=\"button\" sc-camel-on-click=\"{{ gr.use }}\" aria-label=\"{{ gr.useAria }}\" style=\"min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--grad); color: #FFFFFF; font-weight: 700\">Use in a campaign<\u002Fbutto  border-radius: 12px; background: var(--glass2)\">\n<\u002Fdiv>\n<sc-if value=\"{{ imp.reading }}\" hint-placeholder-val=\"{{ false }}\">\n<span aria-live=\"polite\" style=\"font-weight: 600; color: var(--mut)\">Reading the file<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<button type=\"button\" sc-camel-on-click=\"{{ imp.useSample }}\" style=\"min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass2); font-weight: 600; font-size: 14px\">Try a sample file<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ imp.template }}\" style=\"min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass2); font-weight: 600; font-size: 14px\">Download the template<\u002Fbutton>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; color: var(--mut2)\"><span style=\"font-weight: 700; color: var(--ink)\">Columns LOOPX looks for:<\u002Fspan> email address (the only one required), first name, last name, company, customer since, last {{ tx.noun }} date, number of {{ tx.nouns }}, total spent, subscribed to email and tags. Column names do not need to match exactly.<\u002Fp>\n<sc-if value=\"{{ imp.hasOk }}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"background: var(--okBg); color: var(--okInk); border-radius: 12px; padding: 10px 12px; font-size: 14px\">{{ imp.okMsg }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ imp.showPaste }}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-label=\"Paste a list\" style=\"background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--glassLine); border-radius: 20px; box-shadow: 0 10px 30px rgba(76,40,180,0.10); padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n<label for=\"lx-imp-paste\" style=\"font-weight: 700\">Paste one customer per line<\u002Fla \"padding: 8px 0 8px 10px; font-weight: 600\">Use it as<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{ imp.cols }}\" as=\"mc\" hint-placeholder-count=\"6\">\n<sc-raw-tr style=\"border-top: 1px solid var(--line2)\">\n<sc-raw-td style=\"padding: 8px 10px 8px 0; font-weight: 700; overflow-wrap: anywhere\">{{ mc.name }}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 8px 10px; font-size: 13px; color: var(--mut2); overflow-wrap: anywhere\">{{ mc.sample }}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 8px 0 8px 10px; min-width: 210px\">\n<sc-raw-select aria-label=\"{{ mc.aria }}\" value=\"{{ mc.val }}\" sc-camel-on-change=\"{{ mc.on }}\" style=\"box-sizing: border-box; width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--glass2); {{ mc.css }}\">\n<option value=\"skip\">Do not import<\u002Foption>\n<option value=\"email\">Email address (required)<\u002Foption>\n<option value=\"first\">First name<\u002Foption>\n<option value=\"last\">Last name<\u002Foption>\n<option value=\"company\">Company<\u002Foption>\n<option value=\"fa\">Customer since<\u002Foption>\n<option value=\"la\">Last {{ tx.noun }} date<\u002Foption>\n<option value=\"n\">Number of {{ tx.nouns }}<\u002Foption>\n<option value=\"spent\">Total spent<\u002Foption>\n<option value=\"sub\">Subscribed to email<\u002Foption>\n<option value=\"route\">Usual route<\u002Foption>\n<option value=\"tags\">Tags<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<sc-if value=\"{{ imp.hasMore }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; font-size: 13px; color: var(--mut)\">{{ imp.moreText }}<\u002Fp>\n<\u002Fsc-if>\n<div style=\"font-size: 14px; border-radius: 12px; padding: 10px 12px; {{ imp.mapCss }}\">{{ imp.mapNote }}<\u002Fdiv>\n<label style=\"display: flex; gap: 10px; align-items: flex-start; min-height: }}<\u002Fdiv>\n<div style=\"font-size: 13px; font-weight: 600; {{ sx.statusCss }}\">{{ sx.status }}<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ sx.toggle }}\" disabled=\"{{ sx.busy }}\" style=\"margin-top: auto; min-height: 44px; padding: 0 14px; border-radius: 12px; font-weight: 700; {{ sx.btnCss }}\">{{ sx.btn }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 13px; color: var(--mut)\">Connections are simulated in this preview: connecting adds sample customers for that source.<\u002Fp>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ imp.hasHistory }}\" hint-placeholder-val=\"{{ false }}\">\n<section aria-label=\"Customer sources\" style=\"background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--glassLine); border-radius: 20px; box-shadow: 0 10px 30px rgba(76,40,180,0.10); padding: 16px 20px 8px\">\n<h2 style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px\">Where {{ me.companyPos }} customers come from<\u002Fh2>\n<sc-for list=\"{{ imp.history }}\" as=\"hx\" hint-placeholder-count=\"2\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 0; border-top: 1px solid var(--line2)\">\n<span aria-hidden=\"true\" style=\"flex: 0 0 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: #FFFFFF; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13px; {{ hx.tile }}\">{{ hx.mark }}<\u002Fspan>\n<div style=\"flex: 2 1 220px; min-width: 0\"><div style=\"font-weight: 700; overflow-wrap: anywhere\">{{ hx.name }}<\u002Fdiv><div style=\"font-size: 13px; color: var(--mut)\">{{ hx.detail }}<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 0 0 auto; text-align: right\"><div style=\"font-family: 'Sora', sans-serif; font-weight: 700\">{{ hx.n }}<\u002Fdiv><div style=\"font-size: 12px; color: var(--mut)\">customers<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<button type=\"button\" sc-camel-on-click=\"{{ hx.view }}\" style=\"min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass2); font-weight: 600; font-size: 14px\">View<\u002Fbutton>\n<sc-if value=\"{{ hx.canSend }}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" sc-camel-on-click=\"{{ hx.send }}\" style=\"min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass2); font-weight: 600; font-size: 14px\">Send a campaign<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ cux.track }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n\n<section aria-label=\"What is tracked\" style=\"background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--glassLine); border-radius: 20px; box-shadow: 0 10px 30px rgba(76,40,180,0.10); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px\">\n<div><h2 style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px\">What LOOPX can see for {{ me.company }}<\u002Fh2><p style=\"margin: 4px 0 0; color: var(--mut); max-width: 78ch\">Every email link carries a private customer token. When someone clicks, the website snippet keeps that token, so their visits and {{ tx.nouns }} are matched to that person, not just counted.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{ trk.flow }}\" as=\"tf\" hint-placeholder-count=\"6\">\n<div style=\"flex: 1 1 140px; box-sizing: border-box; border-radius: 14px; padding: 10px 12px; background: var(--glass2); border: 1px solid var(--line2); display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-weight: 700; font-size: 14px\">{{ tf.label }}<\u002Fspan>\n<span style=\"font-size: 12px; color: var(--mut)\">{{ tf.by }}<\u002Fspan>\n<span style=\"align-self: flex-start; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; {{ tf.css }}\">{{ tf.status }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start\">\n<section aria-label=\"Email events\" style=\"flex: 1 1 260px; min-width: 0; box-sizing: border-box; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--glassLine); border-radius: 20px; box-shadow: 0 10px 30px rgba(76,40,180,0.10); padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px\"><span aria-hidden=\"true\" style=\"flex: 0 0 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: #FFFFFF; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13px; background: var(--n1)\">1<\u002Fspan><h3 style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px\">Email events<\u002Fh3><span style=\"font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--okBg); color: var(--okInk)\">On, automatic<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; color: var(--mut2)\">Delivered, opened, clicked, bounced and unsubscribed come from the sending service for every email LOOPX sends. There is nothing to install.<\u002Fp>\n<\u002Fsection>\n\n<section aria-label=\"Website snippet\" style=\"flex: 2 1 420px; min-width: 0; box-sizing: border-box; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--glassLine); border-radius: 20px; box-shadow: 0 10px 30px rgba(76,40,180,0.10); padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px\"><span aria-hidden=\"true\" style=\"flex: 0 0 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: #FFFFFF; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13px; background: var(--n2)\">2<\u002Fspan><h3 style=\"margin: 0; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px\">Website snippet<\u002Fh3><span style=\"font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; {{ trk.siteCss }}\">{{ trk.siteStatus }}<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; color: var(--mut2)\">Add this code to every page of {{ me.companyPos }} website. It records visits from email links, and the {{ tx.nouns }} customers {{ tx.make }}.<\u002Fp>\n<pre style=\"margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--inv); color: #F4F1FF; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.55; white-space: pre\"><code>{{ trk.snippet }}<\u002Fcode><\u002Fpre>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end\">\n<button type=\"button\" sc-camel-on-click=\"{{ trk.copySnippet }}\" style=\"min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass2); font-weight: 600; font-size: 14px\">{{ trk.copySnippetLabel }}<\u002Fbutton>\n<div style=\"flex: 1 1 200px; display: flex; flex-direction: column; gap: 4px\"><label for=\"lx-trk-d\" style=\"font-size: 14px; font-weight: 600\">Website address<\u002Flabel><input id=\"lx-trk-d\" type=\"text\" inputmode=\"url\" autocomplete=\"off\" value=\"{{ trk.domain }}\" sc-camel-on-change=\"{{ trk.onDomain }}\" placeholder=\"example.com\" style=\"box-sizing: border-box; width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: );\nlet cur = list.find((w) => w.id === st.wsId);\nlet picked = false;\ntry { picked = localStorage.getItem('loopx-srv-picked') === '1'; localStorage.setItem('loopx-srv-picked', '1'); } catch (e) {}\nif (cur && !cur.sid && recs.length && !picked) cur = null;  // first visit: open a real client, not a sample\nthis.setState({ workspaces: list });\nif (!cur && recs.length) this.later(40, () => this.switchWs(recs[0].id));\nelse if (!cur && list.length) this.later(40, () => this.switchWs(list[0].id));\nelse if (cur && cur.sid) this.srvLoadWs(cur);\n}).catch((e) => {\nthis._srvBooting = false;\nif (e && e.status === 401) this.setState({ authed: false, booting: false });\n});\n}\n\nsrvCfgKey(s) { return JSON.stringify([s.agentsCfg, s.opt, s.cap, !!s.agentsPaused]); }\n\nsrvLoadWs(rec) {\nconst id = rec.sid;\nthis._srvLoaded = null;\nPromise.all([this.srvApi('GET', '/workspaces/' + id), this.srvApi('GET', '/workspaces/' + id + '/contacts'), this.srvApi('GET', '/workspaces/' + id + '/audit')]).then((res) => {\nconst cur = this.srvWs();\nif (!cur || cur.sid !== id) return;\nconst W = res[0].workspace;\nconst base = this.baseState().agentsCfg;\nconst cfg = {};\nObject.keys(base).forEach((k) => { cfg[k] = Object.assign({}, base[k], (W.agents || {})[k] || {}); });\nconst audit = (res[2].audit || []).map((x) => ({ id: 'a' + x.id, t: new Date(x.at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }), who: x.who, text: x.text }));\nconst patch = { contacts: res[1].contacts, agentsCfg: cfg, opt: Object.assign({}, this.state.opt, W.opt || {}), cap: W.cap || 2, agentsPaused: !!W.agents_paused, agAudit: audit, cver: (this.state.cver || 0) + 1, srvLive: null, srvDecs: [], launched: [] };\nthis._srvSynced = this.srvCfgKey(patch);\nthis._srvLoaded = id;\nthis._srvSeenInit = false;\nthis._srvSeen = {};\nthis._ck = null;\nthis.setState(patch);\nthis.srvPoll();\nthis.srvLoadReport();\n}).catch((e) => this.notify('Could not load this client from the rvWs();\nif (cur && cur.sid === w.sid) { this._ck = null; this.setState({ contacts: c.contacts, cver: (this.state.cver || 0) + 1 }); }\n}).catch(() => {});\n}\n\nsrvPushContacts(list) {\nconst w = this.srvWs();\nif (!w) return;\nconst rows = (list || []).map((c) => ({ e: c.e, f: c.f, l: c.l, co: c.co, fa: c.fa, la: c.la, n: c.n, sp: c.sp, sub: c.sub, tg: c.tg }));\nthis.srvApi('POST', '/workspaces/' + w.sid + '/contacts', { contacts: rows, source: 'file' })\n.then(() => { this.srvReloadContacts(); this.srvLoadAudit(); })\n.catch((e) => this.notify('Saving customers to the server failed: ' + e.message));\n}\n\nsrvAudit(text) {\nconst w = this.srvWs();\nif (w) this.srvApi('POST', '/workspaces/' + w.sid + '/audit', { text: text }).catch(() => {});\n}\n\nsrvApprove() {\nconst st = this.state;\nconst w = this.srvWs();\nif (st.approved || !this.can('run') || st.agentsPaused) return;\nconst skip = Object.keys(st.held || {}).filter((k) => st.held[k]);\nthis.srvApi('POST', '/workspaces/' + w.sid + '/plan/approve', { skip: skip }).then((r) => {\nconst at = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });\nthis.setState({ approved: true, approvedAt: at, liveOn: true });\nthis.notify('Today’s plan was approved at ' + at + '. ' + this.f(((r.plan || {}).summary || {}).emails || 0) + ' emails are scheduled. The test wave goes first.');\nthis.srvPoll();\n}).catch((e) => this.notify('The plan was not approved: ' + e.message));\n}\n\nsrvVerdict(id, verdict) {\nconst w = this.srvWs();\nif (!w) return;\nthis.srvApi('POST', '/workspaces/' + w.sid + '/decisions/' + id + '/' + verdict).then(() => {\nthis.notify({ approve: 'Approved.', decline: 'Declined.', undo: 'Undone.' }[verdict] || 'Saved.');\nthis.srvRefreshAll();\n}).catch((e) => this.notify(e.message));\n}\n\nsrvDecisions(key) {\nconst tm = (iso) => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });\nreturn (this.state.srvDecs || []).filter((d) => d.agent === key).map((d) => ({ i gagement', 'Product offers', 'Reactivation'],\nbrief: {\nwhat: 'An online paystub generator. Small employers and contractors create a paystub for each pay period, and can buy W-2, 1099 and W-9 forms at a flat rate per form. Paystubs are paid one at a time or with Credit Bundles, and Multi Pay Stub creates several at once. E-filing goes through TaxZerone.',\nwho: ['Small employers paying a few employees', 'Contractors and self-employed people recording their own pay', 'Household employers such as families with a nanny or caregiver', 'Bookkeepers creating paystubs for several businesses'],\ncycle: 'Customers come back on their own pay cycle: weekly, every two weeks, twice a month or monthly. The best moment to email is a day or two before the next pay date, when the details are saved and ready.',\nsignals: ['Pay frequency and last pay date', 'Employees per paystub run', 'Credit balance', 'Forms bought (W-2, 1099, W-9)', 'Hour the customer usually opens email'],\nstrategy: ['Remind customers a day before each predicted pay date, with their saved details ready.', 'Offer Multi Pay Stub to customers who create several paystubs on the same day, and Credit Bundles to those who pay for each one.', 'Treat year-end (W-2 and 1099) as the biggest seasonal moment, and hand e-filing to TaxZerone.', 'Leave one-time users alone instead of offering discounts.']\n},\nsegs: {\nbi: { name: 'Payday reminder, every 14 days', short: 'Every 14 days', n: 18460, gap: 14, off: 14, window: 'Tomorrow, 7 AM to 1 PM', rate: 0.34, pattern: 'Biweekly payroll', campaign: 'tomorrow’s payday reminder', next: 14, mail: 'payday reminder',\nsubject: '{first}, payday at {biz} is coming up', alt: '{first}, your next paystub for {biz} is ready to start', cta: 'Create the next paystub',\nbody: 'You usually create paystubs for {biz} every two weeks, and the next pay date looks close: around {date}.\\n\\nYour company and employee details are saved, so the next paystub only needs the new pay period and hours.',\nwhy: '{biz} creates a paystub about every 14 days and the next pay date is 1 to 3 days away.' },\nwk: { name: 'Payday reminder, weekly', short: 'Weekly', n: 6210, gap: 7, off: 7, window: 'Tomorrow, 6 AM to 10 AM', rate: 0.41, pattern: 'Weekly payroll', campaign: 'tomorrow’s payday reminder', next: 7, mail: 'payday reminder',\nsubject: '{first}, this week’s paystubs for {biz}', alt: '{first}, ready for this week’s payroll?', cta: 'Create this week’s paystubs',\nbody: '{biz} runs payroll every week, and this week’s pay date looks like {date}.\\n\\nLast week’s employees, rates and deductions are saved. Check the hours and the paystubs are ready to download.',\nwhy: '{biz} creates paystubs every week, usually on the same weekday.' },\nmo: { name: 'Payday reminder, monthly', short: 'Monthly', n: 7170, gap: 30, off: 30, window: 'Tomorrow, 8 AM to 2 PM', rate: 0.28, pattern: 'Monthly payroll', campaign: 'tomorrow’s payday reminder', next: 30, mail: 'payday reminder',\nsubject: '{first}, the monthly paystub for {biz}', alt: '{first}, month-end payroll at {biz}', cta: 'Create this month’s paystub',\nbody: 'You create one paystub a month for {biz}, and this month’s looks due around {date}.\\n\\nEverything from last month is saved, so you only need to confirm the pay period.',\nwhy: '{biz} creates one paystub a month and this month’s is due within the week.' },\nre: { name: 'Re-engagement, missed their usual pay date', short: 'Re-engagement', n: 4380, gap: 30, off: 44, window: 'Today, 5 PM to 8 PM', rate: 0.09, pattern: 'Past their usual pay date', campaign: 'today’s re-engagement email', next: 0, mail: 're-engagement email',\nsubject: '{first}, your {biz} details are still saved', alt: '{first}, pick up where {biz} left off', cta: 'Create a paystub',\nbody: 'We have not seen a paystub from {biz} since your usual pay date.\\n\\nIf payroll is still running, your company and employee details are saved, so the next paystub takes a minute. If something has changed, you can update it before you start.',\nwhy: '{biz} had a regular pay cycle and is now well past its usual pay date.' },\nmp: { name: 'Multi Pay Stub introduction', short: 'Multi Pay Stub', n: 1260, gap: 7, off: 7, window: 'Tomorrow, 8 AM to 11 AM', rate: 0.12, pattern: 'Several employees', campaign: 'tomorrow’s Multi Pay Stub email', next: 7, mail: 'Multi Pay Stub email',\nsubject: '{first}, create every {biz} paystub in one go', alt: '{first}, one step for all your employees', cta: 'Try Multi Pay Stub',\nbody: 'Each pay period you create several paystubs for {biz}, one after another.\\n\\nMulti Pay Stub lets you enter the pay period once and create a paystub for every employee in a single step.',\nwhy: '{biz} creates paystubs for several employees on the same day.' },\ncb: { name: 'Credit Bundle offer', short: 'Credit Bundle', n: 2940, gap: 14, off: 14, window: 'Tomorrow, 9 AM to noon', rate: 0.08, pattern: 'Pays per paystub', campaign: 'tomorrow’s Credit Bundle email', next: 14, mail: 'Credit Bundle email',\nsubject: '{first}, a simpler way to pay for {biz} paystubs', alt: '{first}, skip checkout on each pay date', cta: 'See Credit Bundles',\nbody: '{biz} creates paystubs regularly and pays for each one at checkout.\\n\\nA Credit Bundle covers several paystubs in advance, so each pay date is one step shorter.',\nwhy: '{biz} has bought single paystubs several times in a row on a steady rhythm.' },\nra: { name: 'Reactivation, inactive 60 days or more', short: 'Reactivation', n: 3150, gap: 14, off: 70, window: 'Today, 3 PM to 6 PM', rate: 0.03, pattern: 'Inactive', campaign: 'today’s reactivation email', next: 0, mail: 'reactivation email',\nsubject: '{first}, still need paystubs for {biz}?', alt: '{first}, still running payroll at {biz}?', cta: 'Create a paystub',\nbody: 'If {biz} still runs payroll, your details are saved and ready.\\n\\nIf not, there is nothing to do, and we will not keep emailing you.',\nwhy: '{biz} had a regular pay cycle and then stopped more than 60 days ago. One low-pressure email is worth trying.' },\nalone: { n: 22700, why: '{biz} created a single paystub and shows no recurring pattern, so an email is unlikely to help.' }\n},\nmoments: [\n{ iso: '2026-11-26', title: 'Thanksgiving Day, banks closed', text: 'Thursday pay dates usually move to Wednesday, November 25.', email: 'sps-holiday' },\n{ iso: '2026-12-25', title: 'Christmas Day, banks closed', text: 'Friday pay dates usually move to Thursday, December 24.', email: 'sps-holiday' },\n{ iso: '2026-12-31', title: 'Last pay date of 2026', text: 'Year-to-date totals on the final paystubs feed into each employee’s W-2.', email: 'sps-ytd' },\n{ iso: '2027-01-01', title: 'New Year’s Day, banks closed', text: 'Friday pay dates usually move to Thursday, December 31.', email: 'sps-holiday' },\n{ iso: '2027-01-18', title: 'Martin Luther King Jr. Day, banks closed', text: 'Monday pay dates usually move to Friday, January 15.', email: '' },\n{ iso: D.dW2Iso, title: 'W-2 and 1099-NEC due', text: 'Employers send W-2 to employees and the SSA, and 1099-NEC to contractors and the IRS.', email: 'sps-w2' }\n],\nemails: [\n{ id: 'sps-holiday', name: 'Holiday pay dates', when: 'Send Fri, Nov 20', aud: ['bi', 'wk', 'mo'], subject: '{first}, banks close on Thanksgiving and Christmas', cta: 'Plan my next paystub',\nbody: 'Banks are closed on Thursday, November 26 and Friday, December 25. If a pay date for {biz} falls on either day, payroll usually runs the business day before, so the paystub date moves too.\\n\\nYour employees and pay rates are saved. Create the paystub a day early and use the pay date that matches the deposit.' },\n{ id: 'sps-ytd', name: 'Check year-to-date totals', when: 'Send Mon, Dec 14', aud: ['bi', 'wk', 'mo'], subject: '{first}, check the 2026 year-to-date totals for {biz}', cta: 'Review my paystubs',\nbody: 'The last paystubs of 2026 carry the year-to-date totals your employees will compare with their W-2.\\n\\nBefore the final pay date, check each employee’s year-to-date earnings, taxes and deductions. If something looks wrong, fix it before the last paystub of the year.' },\n{ id: 'sps-w2', name: 'W-2 and 1099 season', when: 'Send Mon, Jan 4', aud: ['bi', 'wk', 'mo', 'mp'], subject: '{first}, W-2s for {biz} are due [[dW2S]]', cta: 'Prepare W-2 forms',\nbody: 'Employers send W-2 copies to employees and the SSA by [[dW2]], and Form 1099-NEC to contractors by the same day.\\n\\nYou can prepare W-2 and 1099 forms in SecurePayStubs at a flat rate per form. To e-file them with the IRS and the SSA, continue to TaxZerone.' },\n{ id: 'sps-remind', name: 'Turn on payday reminders', when: 'After a customer’s second paystub', aud: ['bi', 'wk', 'mo'], subject: '{first}, want a reminder before each pay date?', cta: 'Turn on reminders',\nbody: 'You have created paystubs for {biz} on a regular schedule. Turn on payday reminders and we will email you the day before each pay date, with your details ready to go.\\n\\nYou can change the schedule or turn reminders off at any time.' }\n]\n},\npayticks: {\nindustry: 'travel', url: 'https://www.payticks.com/', domain: 'payticks.com', lead: 3, people: true,\ncycles: [['wk', 10], ['bi', 21], ['mo', 1e9]],\nterms: { noun: 'trip', anoun: 'a trip', make: 'book', makes: 'books', made: 'booked', done: 'booked a trip', date: 'travel date', p1: 'Bus ticket', p2: 'Round trip', p3: 'Sleeper seat' },\nreports: ['Trip reminders', 'Re-engagement', 'Travel offers', 'Reactivation'],\nwords: {\nF: ['Aarav', 'Priya', 'Arjun', 'Divya', 'Ravi', 'Kavya', 'Anjali', 'Karthik', 'Meena', 'Suresh', 'Lakshmi', 'Vignesh', 'Deepa', 'Rahul', 'Sneha', 'Manoj', 'Revathi', 'Ganesh', 'Harini', 'Prakash', 'Nandini', 'Siva', 'Keerthana', 'Vijay', 'Pooja', 'Arun', 'Swathi', 'Dinesh', 'Janani', 'Bala'],\nL: ['Kumar', 'Raman', 'Iyer', 'Nair', 'Reddy', 'Menon', 'Pillai', 'Rao', 'Krishnan', 'Subramanian', 'Murugan', 'Selvam', 'Natarajan', 'Sharma', 'Gupta', 'Das', 'Joshi', 'Patel', 'Varma', 'Shetty'],\nC: ['Chennai', 'Chennai', 'Bengaluru', 'Coimbatore', 'Madurai', 'Chennai', 'Tiruchirappalli', 'Salem', 'Hyderabad', 'Puducherry', 'Tirunelveli', 'Bengaluru', 'Mysuru', 'Kochi', 'Vellore', 'Thanjavur', 'Nagercoil', 'Hosur']\n},\nwd: [2600, 900, 800, 800, 1200, 3900, 1900], holidays: 'none',\ncalText: 'Fridays and Sundays are the busiest travel days. Christmas, New Year’s Day and Pongal all fall on Fridays this season, so expect long-weekend peaks.',\nbrief: {\nwhat: 'A bus ticket booking app and website in India, built by Avaniral. Travellers compare operators on more than 15,000 routes by departure time, fare and bus type (seater, sleeper, AC, Volvo), book one way or a round trip, and cancel from the app.',\nwho: ['Students and workers going home at weekends', 'Families travelling for festivals', 'Regular travellers between two cities', 'One-time holiday travellers'],\ncycle: 'Repeat travellers book the same route on a rhythm, often out on Friday and back on Sunday. Festivals and long weekends (Christmas, New Year, Pongal, Republic Day) create the biggest peaks, and seats on popular buses sell out early.',\nsignals: ['Usual route and travel day', 'Days between trips', 'One-way or round-trip bookings', 'Seat type: seater, sleeper, AC', 'How far ahead they book', 'Festival travel last year'],\nstrategy: ['Remind repeat travellers two to three days before their usual travel day, naming their route.', 'Email festival travellers several weeks before the festival.', 'Suggest a round trip to people who always book the return separately.', 'Keep emails short: the route, the date and one button.']\n},\nsegs: {\nbi: { name: 'Every two weeks, same route', short: 'Every 2 weeks', n: 1360, gap: 14, off: 14, window: 'Tomorrow, 7 PM to 9 PM', rate: 0.31, pattern: 'Same route every two weeks', campaign: 'the trip reminder', next: 14, mail: 'trip reminder',\nsubject: '{first}, your next trip on {route}?', alt: '{first}, time to travel {route} again?', cta: 'Book my trip',\nbody: 'You travel {route} about every two nIf you are travelling again, you can compare operators and book in a minute. If your plans have changed, there is nothing to do.',\nwhy: '{biz} used to travel {route} regularly and is now well past the usual date.' },\nmp: { name: 'Pongal travel: book early', short: 'Pongal', n: 2600, gap: 365, off: 300, window: 'Tomorrow, 7 PM to 9 PM', rate: 0.14, pattern: 'Travelled for Pongal last year', campaign: 'the Pongal travel email', next: 0, mail: 'Pongal travel email',\nsubject: '{first}, Pongal is on a Friday: book {route} early', alt: '{first}, plan your Pongal trip home', cta: 'Book Pongal travel',\nbody: 'Thai Pongal falls on Friday, January 15, 2027, which makes a long weekend. Buses on {route} fill early for Bhogi and Pongal.\\n\\nBook now to choose your departure time and seat type. If your plans change, you can cancel from the app.',\nwhy: '{biz} travelled {route} in the week of Pongal last year.' },\ncb: { name: 'Round trip for one-way bookers', short: 'Round trip', n: 1150, gap: 14, off: 14, window: 'Tomorrow, 7 PM to 9 PM', rate: 0.10, pattern: 'Books each way separately', campaign: 'the round-trip email', next: 14, mail: 'round-trip email',\nsubject: '{first}, book both ways on {route} at once', alt: '{first}, settle your return seat now', cta: 'Book a round trip',\nbody: 'You usually book {route} one way, then book the return a few days later.\\n\\nRound-trip booking lets you choose both journeys in one go, so your return seat is settled before you leave.',\nwhy: '{biz} books the return journey separately most of the time.' },\nra: { name: 'Inactive for 90 days or more', short: 'Reactivation', n: 1980, gap: 30, off: 120, window: 'Today, 6 PM to 8 PM', rate: 0.03, pattern: 'Inactive', campaign: 'the reactivation email', next: 0, mail: 'reactivation email',\nsubject: '{first}, planning a trip soon?', alt: '{first}, travelling again?', cta: 'Find a bus',\nbody: 'It has been a while since your last trip with Payticks. Buses on more than 15,000 routes across In
